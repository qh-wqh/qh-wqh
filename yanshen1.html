<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>行程定制 · Pop Art 杂志风</title>
  <link rel="stylesheet" href="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/tailwindcss/2.2.19/tailwind.min.css">
  <link rel="stylesheet" href="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-100-M/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pop-red: #ff1744;
      --pop-yellow: #ffe600;
      --pop-blue: #2979ff;
      --pop-black: #111;
      --pop-white: #fff;
      --pop-shadow: 0 2px 8px rgba(0,0,0,0.12);
      --pop-radius: 1.2rem;
      --pop-bubble: 2.5px solid var(--pop-black);
      --pop-green: #00e676;
      --pop-orange: #ff9100;
      --pop-pink: #ff80ab;
    }
    html, body {
      font-family: 'Noto Sans SC', 'Noto Serif SC', Arial, sans-serif;
      background: var(--pop-yellow);
      color: var(--pop-black);
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }
    .pop-bubble {
      border: var(--pop-bubble);
      border-radius: var(--pop-radius);
      box-shadow: var(--pop-shadow);
      background: var(--pop-white);
      position: relative;
      overflow: hidden;
    }
    .pop-dot-bg {
      background: repeating-radial-gradient(circle at 10px 10px, #000 0, #000 1.5px, transparent 2.5px, transparent 18px);
      opacity: 0.08;
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .pop-explode {
      display: inline-block;
      background: var(--pop-red);
      color: var(--pop-white);
      font-weight: 700;
      border-radius: 1.2rem 1.2rem 1.2rem 0;
      padding: 0.2em 0.8em;
      font-size: 1.1em;
      box-shadow: 2px 2px 0 var(--pop-black);
      border: 2.5px solid var(--pop-black);
      margin-right: 0.5em;
      letter-spacing: 1px;
    }
    .pop-action-btn {
      background: var(--pop-blue);
      color: var(--pop-white);
      border: 2.5px solid var(--pop-black);
      border-radius: 999px;
      box-shadow: 2px 2px 0 var(--pop-black);
      font-size: 1.2rem;
      padding: 0.5em 0.9em;
      margin: 0 0.2em;
      transition: background 0.2s, transform 0.1s;
      outline: none;
    }
    .pop-action-btn:active {
      background: var(--pop-red);
      transform: scale(0.95) rotate(-2deg);
    }
    .pop-section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.5em;
      display: flex;
      align-items: center;
      gap: 0.5em;
      letter-spacing: 1px;
      font-family: 'Noto Serif SC', serif;
    }
    .pop-section-title .fa {
      color: var(--pop-blue);
      font-size: 1.3em;
    }
    .pop-card {
      margin-bottom: 1.2em;
      position: relative;
      z-index: 1;
      transition: box-shadow 0.2s;
    }
    .pop-card:active {
      box-shadow: 0 0 0 4px var(--pop-pink);
    }
    .pop-night {
      background: #181818 !important;
      color: #fff !important;
    }
    .pop-night .pop-bubble {
      background: #232323 !important;
      color: #fff !important;
      border-color: #fff !important;
    }
    .pop-night .pop-explode {
      background: #ffe600 !important;
      color: #111 !important;
      border-color: #fff !important;
    }
    .pop-night .pop-action-btn {
      background: #ff1744 !important;
      color: #fff !important;
      border-color: #fff !important;
    }
    .pop-night .pop-section-title .fa {
      color: #ffe600 !important;
    }
    .pop-night .pop-dot-bg {
      background: repeating-radial-gradient(circle at 10px 10px, #fff 0, #fff 1.5px, transparent 2.5px, transparent 18px);
      opacity: 0.10;
    }
    .pop-night .pop-highlight {
      background: #ffe600 !important;
      color: #111 !important;
    }
    .pop-highlight {
      background: var(--pop-yellow);
      color: var(--pop-red);
      border-radius: 0.5em;
      padding: 0 0.3em;
      font-weight: 700;
      margin: 0 0.1em;
      display: inline-block;
    }
    /* 滚动条美化 */
    ::-webkit-scrollbar { width: 6px; background: #eee; }
    ::-webkit-scrollbar-thumb { background: #bbb; border-radius: 3px; }
  </style>
</head>
<body class="relative min-h-screen flex flex-col items-center justify-start pt-16 pb-8">
  <!-- 顶部导航栏 -->
  <div id="pop-navbar" class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-3 py-2 bg-white bg-opacity-90 border-b-4 border-black shadow-lg" style="backdrop-filter: blur(6px);">
    <div class="flex items-center gap-2">
      <button class="pop-action-btn" onclick="history.back()" title="返回"><i class="fa fa-arrow-left"></i></button>
      <span class="font-bold text-lg tracking-wider" style="font-family:'Noto Serif SC',serif;">行程定制 <span class="pop-bang pop-bang-yellow">DIY!</span></span>
    </div>
    <div class="flex items-center gap-1">
      <button class="pop-action-btn" id="btn-share" title="分享"><i class="fa fa-share-alt"></i></button>
      <button class="pop-action-btn" id="btn-fav" title="收藏"><i class="fa fa-star"></i></button>
      <button class="pop-action-btn" id="btn-fav-list" title="收藏夹"><i class="fa fa-folder-open"></i></button>
      <button class="pop-action-btn" id="btn-night" title="夜间模式"><i class="fa fa-moon"></i></button>
      <button class="pop-action-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="回顶部"><i class="fa fa-arrow-up"></i></button>
      <button class="pop-action-btn" id="btn-pdf" title="导出PDF"><i class="fa fa-file-pdf"></i></button>
    </div>
  </div>
  <div class="w-full flex flex-wrap gap-2 justify-center my-2">
    <button class="pop-action-btn" onclick="window.location.href='lvxing.html'">攻略主页</button>
    <button class="pop-action-btn" onclick="window.location.href='yanshen1.html'">行程定制</button>
    <button class="pop-action-btn" onclick="window.location.href='backend.html'">管理后台</button>
  </div>
  <div class="pop-dot-bg"></div>
  <!-- 返回攻略主页按钮 -->
  <div class="w-full flex justify-center my-4">
    <button class="pop-action-btn" onclick="window.location.href='lvxing.html'"><i class="fa fa-arrow-left"></i> 返回攻略主页</button>
  </div>
  <!-- 主体内容区 -->
  <div class="w-full max-w-2xl mx-auto mt-4">
    <!-- 基本信息填写区 -->
    <div class="pop-card pop-bubble p-4 mb-4">
      <div class="pop-section-title"><i class="fa fa-info-circle"></i> 基本信息</div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div><label class="font-bold">出发地</label><input id="from" type="text" class="w-full border rounded px-2 py-1 mt-1" placeholder="如：鹤壁" /></div>
        <div><label class="font-bold">目的地</label><input id="to" type="text" class="w-full border rounded px-2 py-1 mt-1" placeholder="如：云梦山" /></div>
        <div><label class="font-bold">日期</label><input id="date" type="date" class="w-full border rounded px-2 py-1 mt-1" /></div>
        <div><label class="font-bold">人数</label><input id="people" type="number" min="1" max="99" class="w-full border rounded px-2 py-1 mt-1" value="1" /></div>
      </div>
      <div class="mt-4">
        <label class="font-bold">偏好</label>
        <div class="flex flex-wrap gap-2 mt-1">
          <label><input type="checkbox" class="mr-1" name="preference" value="美食">美食</label>
          <label><input type="checkbox" class="mr-1" name="preference" value="文化">文化</label>
          <label><input type="checkbox" class="mr-1" name="preference" value="自然">自然</label>
          <label><input type="checkbox" class="mr-1" name="preference" value="亲子">亲子</label>
          <label><input type="checkbox" class="mr-1" name="preference" value="历史">历史</label>
          <label><input type="checkbox" class="mr-1" name="preference" value="休闲">休闲</label>
        </div>
      </div>
      <button class="pop-action-btn mt-4" id="btn-generate"><i class="fa fa-magic"></i> 自动生成推荐行程</button>
    </div>
    <!-- 推荐景点区 -->
    <div class="pop-card pop-bubble p-4 mb-4" id="recommend-card" style="display:none;">
      <div class="pop-section-title"><i class="fa fa-map-marker-alt"></i> 推荐景点 <span class="text-xs text-gray-500">(可多选)</span></div>
      <div id="recommend-list" class="flex flex-wrap gap-2"></div>
      <div class="mt-2"><input id="custom-scenic" type="text" class="border rounded px-2 py-1" placeholder="自定义添加景点" /><button class="pop-action-btn ml-2" id="btn-add-scenic"><i class="fa fa-plus"></i> 添加</button></div>
    </div>
    <!-- 行程时间表区 -->
    <div class="pop-card pop-bubble p-4 mb-4" id="schedule-card" style="display:none;">
      <div class="pop-section-title"><i class="fa fa-calendar-alt"></i> 行程时间表 <span class="text-xs text-gray-500">(可拖拽排序)</span></div>
      <div id="schedule-list"></div>
      <button class="pop-action-btn mt-3" id="btn-add-schedule"><i class="fa fa-plus"></i> 添加行程项</button>
    </div>
    <!-- 备注/预算/注意事项区 -->
    <div class="pop-card pop-bubble p-4 mb-4" id="extra-card" style="display:none;">
      <div class="pop-section-title"><i class="fa fa-sticky-note"></i> 备注/预算/注意事项</div>
      <textarea id="extra" class="w-full border rounded px-2 py-1" rows="3" placeholder="如：带好身份证、雨具，预算300元，注意安全等"></textarea>
    </div>
    <!-- 操作按钮区 -->
    <div class="flex flex-wrap gap-3 justify-center mt-4" id="action-btns" style="display:none;">
      <button class="pop-action-btn" id="btn-save"><i class="fa fa-save"></i> 保存</button>
      <button class="pop-action-btn" id="btn-export"><i class="fa fa-file-pdf"></i> 导出PDF</button>
      <button class="pop-action-btn" id="btn-collect"><i class="fa fa-star"></i> 收藏</button>
      <button class="pop-action-btn" id="btn-share2"><i class="fa fa-share-alt"></i> 分享</button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script>
    // 登录校验
    if (localStorage.getItem('isLogin') !== '1') {
      window.location.href = 'index.html';
    }
    // 偏好-景点推荐库
    const scenicDB = {
      '美食': ['豆腐菜馆', '烧饼夹肉店', '淇河餐厅', '农家乐'],
      '文化': ['朝歌文化园', '博物馆', '书院', '古戏台'],
      '自然': ['云梦山', '大伾山', '淇滨公园', '森林公园'],
      '亲子': ['动物园', '儿童乐园', '亲子农场'],
      '历史': ['浚县古城', '古庙会', '摩崖造像'],
      '休闲': ['温泉度假村', '咖啡馆', '购物中心']
    };
    // 生成推荐景点
    document.getElementById('btn-generate').onclick = function() {
      const prefs = Array.from(document.querySelectorAll('input[name=preference]:checked')).map(i=>i.value);
      let scenicSet = new Set();
      prefs.forEach(p=>{
        (scenicDB[p]||[]).forEach(s=>scenicSet.add(s));
      });
      // 目的地优先加入
      const to = document.getElementById('to').value.trim();
      if(to) scenicSet.add(to);
      // 展示推荐区
      const recommendCard = document.getElementById('recommend-card');
      recommendCard.style.display = '';
      const recommendList = document.getElementById('recommend-list');
      recommendList.innerHTML = '';
      Array.from(scenicSet).forEach(s=>{
        let label = document.createElement('label');
        label.className = 'bg-yellow-100 text-yellow-800 rounded px-2 py-1 text-xs shadow cursor-pointer flex items-center';
        label.style.marginRight = '0.5em';
        label.innerHTML = `<input type='checkbox' class='mr-1' name='scenic' value='${s}'>${s}`;
        recommendList.appendChild(label);
      });
      document.getElementById('schedule-card').style.display = '';
      document.getElementById('extra-card').style.display = '';
      document.getElementById('action-btns').style.display = '';
      // 清空行程表
      document.getElementById('schedule-list').innerHTML = '';
    };
    // 自定义添加景点
    document.getElementById('btn-add-scenic').onclick = function() {
      const val = document.getElementById('custom-scenic').value.trim();
      if(!val) return;
      let label = document.createElement('label');
      label.className = 'bg-yellow-100 text-yellow-800 rounded px-2 py-1 text-xs shadow cursor-pointer flex items-center';
      label.style.marginRight = '0.5em';
      label.innerHTML = `<input type='checkbox' class='mr-1' name='scenic' value='${val}'>${val}`;
      document.getElementById('recommend-list').appendChild(label);
      document.getElementById('custom-scenic').value = '';
    };
    // 添加行程项
    document.getElementById('btn-add-schedule').onclick = function() {
      const selected = Array.from(document.querySelectorAll('input[name=scenic]:checked')).map(i=>i.value);
      if(selected.length===0) { alert('请先选择景点'); return; }
      const list = document.getElementById('schedule-list');
      selected.forEach(s=>{
        let item = document.createElement('div');
        item.className = 'flex items-center gap-2 mb-2 bg-blue-50 rounded px-2 py-1 shadow';
        item.draggable = true;
        item.innerHTML = `<input type='time' class='border rounded px-1 py-0.5 w-20' value='09:00'> <span class='font-bold'>${s}</span> <input type='text' class='flex-1 border rounded px-1 py-0.5' placeholder='备注/活动' /> <button class='pop-action-btn' title='删除' onclick='this.parentNode.remove()'><i class='fa fa-trash'></i></button>`;
        list.appendChild(item);
      });
      // 取消选择
      document.querySelectorAll('input[name=scenic]:checked').forEach(i=>i.checked=false);
    };
    // 拖拽排序
    new Sortable(document.getElementById('schedule-list'), { animation: 150 });
    // 保存到localStorage
    document.getElementById('btn-save').onclick = function() {
      const trip = collectTripData();
      let trips = JSON.parse(localStorage.getItem('popart_trip_custom')||'[]');
      trips.push(trip);
      localStorage.setItem('popart_trip_custom', JSON.stringify(trips));
      alert('已保存到本地！');
    };
    // 收藏到收藏夹
    document.getElementById('btn-collect').onclick = function() {
      let favs = JSON.parse(localStorage.getItem('popart_trip_fav')||'[]');
      if(!favs.includes(window.location.href)) favs.push(window.location.href);
      localStorage.setItem('popart_trip_fav', JSON.stringify(favs));
      alert('已收藏到本地收藏夹！');
    };
    // 导出PDF
    document.getElementById('btn-export').onclick = function() {
      window.print();
    };
    // 分享
    document.getElementById('btn-share').onclick = document.getElementById('btn-share2').onclick = function() {
      if(navigator.share) {
        navigator.share({ title: document.title, url: window.location.href });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('链接已复制，可粘贴到微信/QQ/微博等分享！');
      }
    };
    // 夜间模式
    function setNightMode(auto) {
      const hour = new Date().getHours();
      if(auto && (hour<6||hour>=19)) document.body.classList.add('pop-night');
    }
    setNightMode(true);
    document.getElementById('btn-night').onclick = function() {
      document.body.classList.toggle('pop-night');
    };
    // 收藏夹管理
    document.getElementById('btn-fav-list').onclick = function() {
      let favs = JSON.parse(localStorage.getItem('popart_trip_fav')||'[]');
      alert('收藏夹：\n'+(favs.length?favs.join('\n'):'暂无收藏'));
    };
    // 收集行程数据
    function collectTripData() {
      const from = document.getElementById('from').value.trim();
      const to = document.getElementById('to').value.trim();
      const date = document.getElementById('date').value;
      const people = document.getElementById('people').value;
      const prefs = Array.from(document.querySelectorAll('input[name=preference]:checked')).map(i=>i.value);
      const schedule = Array.from(document.getElementById('schedule-list').children).map(item=>{
        return {
          time: item.querySelector('input[type=time]').value,
          scenic: item.querySelector('span').textContent,
          note: item.querySelector('input[type=text]').value
        };
      });
      const extra = document.getElementById('extra').value;
      return {from,to,date,people,prefs,schedule,extra,ts:Date.now()};
    }
    function getQueryParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name) || '';
    }
    window.addEventListener('DOMContentLoaded', function() {
      if(getQueryParam('to')) document.getElementById('to').value = getQueryParam('to');
      if(getQueryParam('date')) document.getElementById('date').value = getQueryParam('date');
    });
  </script>
</body>
</html>
