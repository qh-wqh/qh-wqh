<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>本地数据管理后台</title>
  <link rel="stylesheet" href="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/tailwindcss/2.2.19/tailwind.min.css">
  <link rel="stylesheet" href="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-100-M/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pop-red: #ff1744;
      --pop-yellow: #ffe600;
      --pop-blue: #2979ff;
      --pop-black: #111;
      --pop-white: #fff;
      --pop-shadow: 0 2px 8px rgba(0,0,0,0.12);
      --pop-radius: 1.2rem;
      --pop-bubble: 2.5px solid var(--pop-black);
      --pop-green: #00e676;
      --pop-orange: #ff9100;
      --pop-pink: #ff80ab;
    }
    html, body {
      font-family: 'Noto Sans SC', 'Noto Serif SC', Arial, sans-serif;
      background: var(--pop-yellow);
      color: var(--pop-black);
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }
    .pop-bubble {
      border: var(--pop-bubble);
      border-radius: var(--pop-radius);
      box-shadow: var(--pop-shadow);
      background: var(--pop-white);
      position: relative;
      overflow: hidden;
    }
    .pop-section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.5em;
      display: flex;
      align-items: center;
      gap: 0.5em;
      letter-spacing: 1px;
      font-family: 'Noto Serif SC', serif;
    }
    .pop-section-title .fa {
      color: var(--pop-blue);
      font-size: 1.3em;
    }
    .pop-action-btn {
      background: var(--pop-blue);
      color: var(--pop-white);
      border: 2.5px solid var(--pop-black);
      border-radius: 999px;
      box-shadow: 2px 2px 0 var(--pop-black);
      font-size: 1.1rem;
      padding: 0.4em 1.1em;
      margin: 0 0.2em;
      transition: background 0.2s, transform 0.1s;
      outline: none;
    }
    .pop-action-btn:active {
      background: var(--pop-red);
      transform: scale(0.95) rotate(-2deg);
    }
    ::-webkit-scrollbar { width: 6px; background: #eee; }
    ::-webkit-scrollbar-thumb { background: #bbb; border-radius: 3px; }
  </style>
</head>
<body class="relative min-h-screen flex flex-col items-center justify-start pt-10 pb-8">
  <div class="w-full max-w-2xl mx-auto mt-4">
    <div class="pop-card pop-bubble p-4 mb-4 flex items-center justify-between">
      <div class="pop-section-title"><i class="fa fa-database"></i> 本地数据管理后台</div>
      <button class="pop-action-btn" onclick="location.reload()"><i class="fa fa-rotate"></i> 刷新</button>
    </div>
    <div class="w-full flex flex-wrap gap-2 justify-center my-2">
      <button class="pop-action-btn" onclick="window.location.href='lvxing.html'">攻略主页</button>
      <button class="pop-action-btn" onclick="window.location.href='yanshen1.html'">行程定制</button>
      <button class="pop-action-btn" onclick="window.location.href='backend.html'">管理后台</button>
    </div>
    <!-- 用户管理 -->
    <div class="pop-card pop-bubble p-4 mb-4">
      <div class="pop-section-title"><i class="fa fa-user"></i> 用户管理</div>
      <div id="user-list"></div>
      <button class="pop-action-btn mt-2" onclick="addUser()"><i class="fa fa-plus"></i> 新增用户</button>
    </div>
    <!-- 行程管理 -->
    <div class="pop-card pop-bubble p-4 mb-4">
      <div class="pop-section-title"><i class="fa fa-route"></i> 行程管理</div>
      <div id="trip-list"></div>
      <button class="pop-action-btn mt-2" onclick="addTrip()"><i class="fa fa-plus"></i> 新增行程</button>
    </div>
    <!-- 收藏夹管理 -->
    <div class="pop-card pop-bubble p-4 mb-4">
      <div class="pop-section-title"><i class="fa fa-star"></i> 收藏夹管理</div>
      <div id="fav-list"></div>
      <button class="pop-action-btn mt-2" onclick="addFav()"><i class="fa fa-plus"></i> 新增收藏</button>
    </div>
    <!-- 评论管理 -->
    <div class="pop-card pop-bubble p-4 mb-4">
      <div class="pop-section-title"><i class="fa fa-comments"></i> 评论管理</div>
      <div id="comment-list"></div>
      <button class="pop-action-btn mt-2" onclick="addComment()"><i class="fa fa-plus"></i> 新增评论</button>
    </div>
  </div>
  <script>
    // 工具函数
    function getLS(key, def=[]) {
      try { return JSON.parse(localStorage.getItem(key)||'') || def; } catch { return def; }
    }
    function setLS(key, val) {
      localStorage.setItem(key, JSON.stringify(val));
    }
    // 用户管理
    function renderUsers() {
      const users = getLS('popart_trip_users');
      let html = users.length ? '<ul>' + users.map((u,i)=>`<li class='mb-1'>${u.username} <span class='text-xs text-gray-500'>(${u.email||''})</span> <button class='pop-action-btn' onclick='delUser(${i})'><i class='fa fa-trash'></i></button></li>`).join('') + '</ul>' : '<div class="text-gray-500 text-sm">暂无用户</div>';
      document.getElementById('user-list').innerHTML = html;
    }
    function addUser() {
      const username = prompt('用户名?');
      if(!username) return;
      const email = prompt('邮箱?');
      let users = getLS('popart_trip_users');
      users.push({username,email});
      setLS('popart_trip_users', users);
      renderUsers();
    }
    function delUser(idx) {
      let users = getLS('popart_trip_users');
      users.splice(idx,1);
      setLS('popart_trip_users', users);
      renderUsers();
    }
    // 行程管理
    function renderTrips() {
      const trips = getLS('popart_trip_custom');
      let html = trips.length ? '<ul>' + trips.map((t,i)=>`<li class='mb-2 border rounded p-2 bg-yellow-50'>${t.from||''}→${t.to||''} <span class='text-xs text-gray-500'>${t.date||''}</span><br><b>行程:</b> ${(t.schedule||[]).map(s=>s.time+' '+s.scenic).join(' → ')}<br><b>备注:</b> ${t.extra||''} <button class='pop-action-btn' onclick='delTrip(${i})'><i class='fa fa-trash'></i></button></li>`).join('') + '</ul>' : '<div class="text-gray-500 text-sm">暂无行程</div>';
      document.getElementById('trip-list').innerHTML = html;
    }
    function addTrip() {
      const from = prompt('出发地?');
      const to = prompt('目的地?');
      const date = prompt('日期?');
      let trips = getLS('popart_trip_custom');
      trips.push({from,to,date,schedule:[],extra:'',ts:Date.now()});
      setLS('popart_trip_custom', trips);
      renderTrips();
    }
    function delTrip(idx) {
      let trips = getLS('popart_trip_custom');
      trips.splice(idx,1);
      setLS('popart_trip_custom', trips);
      renderTrips();
    }
    // 收藏夹管理
    function renderFavs() {
      const favs = getLS('popart_trip_fav');
      let html = favs.length ? '<ul>' + favs.map((f,i)=>`<li class='mb-1'><a href='${f}' target='_blank' class='underline text-blue-600'>${f}</a> <button class='pop-action-btn' onclick='delFav(${i})'><i class='fa fa-trash'></i></button></li>`).join('') + '</ul>' : '<div class="text-gray-500 text-sm">暂无收藏</div>';
      document.getElementById('fav-list').innerHTML = html;
    }
    function addFav() {
      const url = prompt('收藏网址?');
      if(!url) return;
      let favs = getLS('popart_trip_fav');
      favs.push(url);
      setLS('popart_trip_fav', favs);
      renderFavs();
    }
    function delFav(idx) {
      let favs = getLS('popart_trip_fav');
      favs.splice(idx,1);
      setLS('popart_trip_fav', favs);
      renderFavs();
    }
    // 评论管理
    function renderComments() {
      const comments = getLS('popart_trip_comments');
      let html = comments.length ? '<ul>' + comments.map((c,i)=>`<li class='mb-2 border rounded p-2 bg-blue-50'>${c.user||'匿名'}：${c.text} <span class='text-xs text-gray-500'>${c.ts?new Date(c.ts).toLocaleString():'无时间'}</span> <button class='pop-action-btn' onclick='delComment(${i})'><i class='fa fa-trash'></i></button></li>`).join('') + '</ul>' : '<div class="text-gray-500 text-sm">暂无评论</div>';
      document.getElementById('comment-list').innerHTML = html;
    }
    function addComment() {
      const user = prompt('用户名?');
      const text = prompt('评论内容?');
      if(!text) return;
      let comments = getLS('popart_trip_comments');
      comments.push({user,text,ts:Date.now()});
      setLS('popart_trip_comments', comments);
      renderComments();
    }
    function delComment(idx) {
      let comments = getLS('popart_trip_comments');
      comments.splice(idx,1);
      setLS('popart_trip_comments', comments);
      renderComments();
    }
    // 初始化
    renderUsers();
    renderTrips();
    renderFavs();
    renderComments();
  </script>
</body>
</html>
