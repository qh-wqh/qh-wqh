<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登录 · Pop Art 杂志风旅行攻略</title>
  <link rel="stylesheet" href="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/tailwindcss/2.2.19/tailwind.min.css">
  <link rel="stylesheet" href="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-100-M/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans SC', 'Noto Serif SC', Arial, sans-serif;
      background: var(--pop-yellow, #ffe600);
      color: var(--pop-black, #111);
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }
    .pop-bubble {
      border: 2.5px solid var(--pop-black, #111);
      border-radius: 1.2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      background: var(--pop-white, #fff);
      position: relative;
      overflow: hidden;
    }
    .pop-explode {
      display: inline-block;
      background: var(--pop-red, #ff1744);
      color: var(--pop-white, #fff);
      font-weight: 700;
      border-radius: 1.2rem 1.2rem 1.2rem 0;
      padding: 0.2em 0.8em;
      font-size: 1.1em;
      box-shadow: 2px 2px 0 var(--pop-black, #111);
      border: 2.5px solid var(--pop-black, #111);
      margin-right: 0.5em;
      letter-spacing: 1px;
    }
    .pop-action-btn {
      background: var(--pop-blue, #2979ff);
      color: var(--pop-white, #fff);
      border: 2.5px solid var(--pop-black, #111);
      border-radius: 999px;
      box-shadow: 2px 2px 0 var(--pop-black, #111);
      font-size: 1.2rem;
      padding: 0.5em 0.9em;
      margin: 0 0.2em;
      transition: background 0.2s, transform 0.1s;
      outline: none;
    }
    .pop-action-btn:active {
      background: var(--pop-red, #ff1744);
      transform: scale(0.95) rotate(-2deg);
    }
    .pop-bang {
      font-family: Impact, 'Arial Black', sans-serif;
      color: var(--pop-blue, #2979ff);
      font-size: 1.1em;
      letter-spacing: 2px;
      margin: 0 0.2em;
    }
    .pop-bang-yellow { color: var(--pop-yellow, #ffe600); text-shadow: 1px 1px 0 var(--pop-red, #ff1744); }
    @media (max-width: 640px) {
      .pop-bubble {
        border-radius: 0.8rem;
        padding: 1.2rem 0.5rem;
      }
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">
  <div class="w-full max-w-sm mx-auto pop-bubble p-8 mt-8">
    <div class="flex flex-col items-center mb-6">
      <div class="pop-explode text-2xl mb-2">登录 <span class="pop-bang pop-bang-yellow">WELCOME!</span></div>
      <div class="text-lg font-bold mb-1" style="font-family:'Noto Serif SC',serif;">Pop Art 杂志风旅行攻略</div>
    </div>
    <form id="login-form" class="flex flex-col gap-4">
      <div>
        <label class="block mb-1 font-semibold" for="username"><i class="fa fa-user mr-1"></i>用户名</label>
        <input id="username" name="username" type="text" required class="w-full border-2 border-black rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="请输入用户名">
      </div>
      <div>
        <label class="block mb-1 font-semibold" for="password"><i class="fa fa-lock mr-1"></i>密码</label>
        <input id="password" name="password" type="password" required class="w-full border-2 border-black rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="请输入密码">
      </div>
      <div class="flex items-center">
        <input id="remember" name="remember" type="checkbox" class="mr-2">
        <label for="remember" class="text-sm">记住我</label>
      </div>
      <div id="error-msg" class="text-red-600 text-sm min-h-[1.5em]"></div>
      <button type="submit" class="pop-action-btn w-full flex items-center justify-center"><i class="fa fa-sign-in-alt mr-2"></i>登录</button>
    </form>
  </div>
  <script>
    // 简单前端校验和假登录逻辑
    document.getElementById('login-form').onsubmit = function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      if (!username || !password) {
        errorMsg.textContent = '请输入用户名和密码';
        return;
      }
      // 假登录逻辑（用户名：QH，密码：123456）
      if (username === 'QH' && password === '123456') {
        errorMsg.textContent = '';
        localStorage.setItem('isLogin', '1');
        // 跳转到主页面
        window.location.href = 'lvxing.html';
      } else {
        errorMsg.textContent = '用户名或密码错误';
      }
    };
  </script>
</body>
</html>
